# name: mongo-sharding -- у меня в распоряжении старый докер, который не поддерживает name, сделал через .env

services:

# Config servers
  configSrv1:
    image: mongo:latest
    container_name: configSrv1
    restart: always
    ports:
      - "27017:27017"
    networks:
      - mongo-sharding-network
    volumes:
      - configSrv1-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet || exit 1
      interval: 10s
      start_period: 40s

  configSrv2:
    image: mongo:latest
    container_name: configSrv2
    restart: always
    ports:
      - "27018:27018"
    networks:
      - mongo-sharding-network
    volumes:
      - configSrv2-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27018"
      ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27018 --quiet || exit 1
      interval: 10s
      start_period: 40s

  configSrv3:
    image: mongo:latest
    container_name: configSrv3
    restart: always
    ports:
      - "27019:27019"
    networks:
      - mongo-sharding-network
    volumes:
      - configSrv3-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27019"
      ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27019 --quiet || exit 1
      interval: 10s
      start_period: 40s

  setup-config:
    image: mongo:latest
    container_name: mongo-setup-config
    volumes:
      - ./scripts:/scripts
    networks:
      - mongo-sharding-network
    depends_on:
      configSrv1:
        condition: service_started
      configSrv2:
        condition: service_started
      configSrv3:
        condition: service_started
    entrypoint: ["/bin/bash", "/scripts/mongo-sharding-init-config-servers.sh"]

# Routers
  router1:
    image: mongo:latest
    container_name: router1
    restart: always
    ports:
      - "27020:27020"
    networks:
      - mongo-sharding-network
    depends_on:
      setup-config:
        condition: service_completed_successfully
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv1:27017,configSrv2:27018,configSrv3:27019",
        "--bind_ip_all",
        "--port",
        "27020"
      ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27020 --quiet || exit 1
      interval: 10s
      start_period: 30s

  router2:
    image: mongo:latest
    container_name: router2
    restart: always
    ports:
      - "27021:27021"
    networks:
      - mongo-sharding-network
    depends_on:
      setup-config:
        condition: service_completed_successfully
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv1:27017,configSrv2:27018,configSrv3:27019",
        "--bind_ip_all",
        "--port",
        "27021"
      ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27021 --quiet || exit 1
      interval: 10s
      start_period: 30s

# Shards
  shard1:
    image: mongo:latest
    container_name: shard1
    restart: always
    ports:
      - "27022:27022"
    networks:
      - mongo-sharding-network
    volumes:
      - shard1-data:/data/db
    depends_on:
      setup-config:
        condition: service_completed_successfully
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1",
        "--bind_ip_all",
        "--port",
        "27022"
      ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27022 --quiet || exit 1
      interval: 10s
      start_period: 30s

  shard2:
    image: mongo:latest
    container_name: shard2
    restart: always
    ports:
      - "27023:27023"
    networks:
      - mongo-sharding-network
    volumes:
      - shard2-data:/data/db
    depends_on:
      setup-config:
        condition: service_completed_successfully
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2",
        "--bind_ip_all",
        "--port",
        "27023"
      ]
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27023 --quiet || exit 1
      interval: 10s
      start_period: 30s

  setup-shards:
    image: mongo:latest
    container_name: mongo-setup-shards
    volumes:
      - ./scripts:/scripts
    networks:
      - mongo-sharding-network
    depends_on:
      router1:
        condition: service_started
      router2:
        condition: service_started
      shard1:
        condition: service_started
      shard2:
        condition: service_started
    entrypoint: [ "/bin/bash", "/scripts/mongo-sharding-init-shards.sh" ]

# Application
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      setup-shards:
        condition: service_completed_successfully
    ports:
      - 8080:8080
    networks:
      - mongo-sharding-network
    environment:
      MONGODB_URL: "mongodb://router1:27020,router2:27021"
      MONGODB_DATABASE_NAME: "somedb"

networks:
  mongo-sharding-network:
    driver: bridge

volumes:
  configSrv1-data:
  configSrv2-data:
  configSrv3-data:
  shard1-data:
  shard2-data:
